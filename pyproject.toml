[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sixnimmt-rl"
version = "0.0.1"
description = "Gymnasium environment for 6 nimmt! (Six Qui Prend) - V0"
requires-python = ">=3.9"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]